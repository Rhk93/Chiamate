name: Compila APK Chiamate

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Scarica la repository
        uses: actions/checkout@v5

      - name: Estrai lo zip del progetto
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Zip trovato: $ZIP"
          rm -rf progetto && mkdir progetto
          unzip -o -q "$ZIP" -d progetto
          DIR=$(dirname "$(find progetto -name settings.gradle | head -n 1)")
          echo "DIR=$DIR" >> "$GITHUB_ENV"

      - name: Installa Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Compila l'APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Carica l'APK
        uses: actions/upload-artifact@v5
        with:
          name: Chiamate-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/debug/*.apk
